name: 例規データを更新

on:
  schedule:
    - cron: "17 18 * * 0"   # 毎週月曜 3:17（日本時間）
  workflow_dispatch:         # Actions タブから手動でも実行できる
  push:
    branches: [main]
    paths:
      - scripts/update.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-reiki
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 例規集を巡回して取り込む
        run: python scripts/update.py

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "例規データを更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
