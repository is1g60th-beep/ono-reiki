<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大野町例規検索</title>
<meta name="description" content="岐阜県揖斐郡大野町の条例・規則を名称・編・種別で検索">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="例規検索">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
/* Layout: 加除式例規集のインデックスタブ。広い画面は左に編タブの縦列＋右に検索と章ごとの一覧、狭い画面はタブが上部の横帯になる。左揃え。 */
:root{
  --paper:#f2f4f6;      /* 冷たい白。公文書の用紙 */
  --sheet:#ffffff;      /* 一覧の面 */
  --ink:#18222d;        /* 本文の墨 */
  --ink-2:#5a6672;      /* 補足 */
  --rule:#d5dbe1;       /* 罫線 */
  --focus:#1f5fbf;      /* フォーカスと選択 */
  --jorei:#1f4f8f;      /* 条例 */
  --kisoku:#2f6b45;     /* 規則 */
  --hit:#ffe27a;        /* 検索語 */
  --tab-l:.66; --tab-c:.12; --tab-sel:.5; /* 編タブの明度・彩度、選択時の明度 */
  --ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --num:"BIZ UDGothic","Hiragino Sans","Yu Gothic",ui-monospace,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141a21;--sheet:#1b232c;--ink:#e6ebf0;--ink-2:#9aa6b2;--rule:#2e3944;
  --focus:#7fb0ff;--jorei:#93b9ee;--kisoku:#8fd0a6;--hit:#6b5512;--tab-l:.72;--tab-c:.1;--tab-sel:.52;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a21;--sheet:#1b232c;--ink:#e6ebf0;--ink-2:#9aa6b2;--rule:#2e3944;
  --focus:#7fb0ff;--jorei:#93b9ee;--kisoku:#8fd0a6;--hit:#6b5512;--tab-l:.72;--tab-c:.1;--tab-sel:.52;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:1080px;margin:0 auto;padding-block:28px 56px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:0 36px}
.top{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px;padding-bottom:20px}
h1{margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:.02em}
.asof{margin:0;color:var(--ink-2);font-size:14px}

/* 編インデックスタブ */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.tab{--c:oklch(var(--tab-l) var(--tab-c) var(--h));width:100%;display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;gap:6px;
  padding:7px 12px 7px 14px;border:0;border-left:8px solid var(--c);border-radius:0 6px 6px 0;background:var(--sheet);
  text-align:left;cursor:pointer;font-size:15px;line-height:1.35;transition:transform .15s ease,background-color .15s ease}
.tab .no{font-family:var(--num);font-size:12.5px;color:var(--ink-2)}
.tab .n{font-family:var(--num);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tab:hover{transform:translateX(4px)}
.tab[aria-pressed="true"]{border-color:oklch(var(--tab-sel) var(--tab-c) var(--h));background:oklch(var(--tab-sel) var(--tab-c) var(--h));color:#fff;transform:translateX(10px);font-weight:700}
.tab[aria-pressed="true"] .no,.tab[aria-pressed="true"] .n{color:#fff}
.tab.all{--c:var(--ink)}
.tab.all[aria-pressed="true"]{border-color:var(--ink);background:var(--ink)}
.tab.all[aria-pressed="true"]{color:var(--paper)}
.tab.all[aria-pressed="true"] .n{color:var(--paper)}

/* 検索 */
.main{min-width:0}
.find{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--paper);padding-block:0 12px;display:flex;flex-direction:column;gap:10px}
.box{position:relative}
.box svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--ink-2);pointer-events:none}
#q{width:100%;font-size:18px;padding:14px 48px 14px 44px;border:2px solid var(--ink);border-radius:6px;background:var(--sheet)}
#q::placeholder{color:var(--ink-2)}
#q:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in oklab,var(--focus) 25%,transparent)}
#q::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:6px;top:50%;translate:0 -50%;width:38px;height:38px;border:0;border-radius:4px;background:transparent;color:var(--ink-2);font-size:22px;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet)}
.count{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.count b{color:var(--ink);font-size:16px}
.hints{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;color:var(--ink-2)}
.hints button{border:0;background:none;padding:0;color:var(--focus);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* 一覧：章ごとに綴じる */
.list{margin:0;padding:0;list-style:none}
.chap{--c:oklch(var(--tab-l) var(--tab-c) var(--h));margin-top:18px}
.chap h2{margin:0 0 6px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink-2)}
.chap h2::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--c);flex:none}
.chap ul{margin:0;padding:0;list-style:none;background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.chap li+li{border-top:1px solid var(--rule)}
.chap a{display:block;padding:12px 16px;color:inherit;text-decoration:none}
.chap a:hover{background:color-mix(in oklab,var(--c) 9%,var(--sheet))}
.chap a:focus-visible{outline-offset:-3px}
.name{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:3px;font-size:13.5px;color:var(--ink-2)}
.no2{font-family:var(--num);font-variant-numeric:tabular-nums}
.k{font-weight:700}
.k.jorei{color:var(--jorei)}
.k.kisoku{color:var(--kisoku)}
mark{background:var(--hit);color:inherit;border-radius:2px;padding:0 1px}
.empty{margin-top:24px;padding:20px;background:var(--sheet);border:1px dashed var(--rule);border-radius:6px}
.empty p{margin:0 0 8px}
.empty button{border:1px solid var(--ink);background:transparent;border-radius:6px;padding:6px 14px;cursor:pointer}

footer{grid-column:2;margin-top:36px;font-size:13.5px;color:var(--ink-2);max-width:40em}
footer p{margin:0 0 6px}
footer a{color:var(--focus)}

/* 狭い画面：タブを上部の横帯に */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:18px 48px}
  .top{padding-bottom:12px}
  h1{font-size:24px}
  .tabs{position:static;flex-direction:row;overflow-x:auto;gap:4px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs li{flex:none}
  .tab{display:flex;gap:6px;border-left:0;border-top:6px solid var(--c);border-radius:0 0 6px 6px;padding:6px 12px;font-size:14px;white-space:nowrap}
  .tab .no{display:none}
  .tab:hover{transform:none}
  .tab[aria-pressed="true"]{transform:translateY(4px)}
  .find{padding-top:8px}
  footer{grid-column:1}
}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

/* 条文検索・新着 */
.ft{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ft input{width:18px;height:18px;accent-color:var(--focus);margin:0}
.ft small{color:var(--ink-2);font-size:12.5px}
.sec{margin-top:22px}
.sec>h3{margin:0;font-size:15px;display:flex;align-items:baseline;gap:8px}
.sec>h3 small{font-family:var(--num);font-weight:400;color:var(--ink-2);font-size:13px}
.sec>p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.snip{display:block;margin-top:6px;padding:6px 10px;border-left:3px solid var(--rule);font-size:14px;line-height:1.75;color:var(--ink);overflow-wrap:anywhere}
.snip+.snip{margin-top:4px}
.hits{font-family:var(--num);font-variant-numeric:tabular-nums}
.news{margin-top:16px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.news h2{margin:0;font-size:15px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.news h2 small{font-weight:400;font-size:13px;color:var(--ink-2)}
.news p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.news ul{margin:8px 0 0;padding:0;list-style:none}
.news li{display:grid;grid-template-columns:5.2em 4.6em minmax(0,1fr);gap:2px 10px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px;align-items:baseline}
.news li:first-child{border-top:0}
.news time{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.chg{font-weight:700;font-size:13px}
.chg.add{color:var(--kisoku)}
.chg.rev{color:var(--jorei)}
.chg.del{color:var(--ink-2)}
.news a{color:inherit;font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.news a:hover{text-decoration:underline}
.news .more{margin-top:8px;border:0;background:none;padding:0;color:var(--focus);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.loading{margin-top:24px;color:var(--ink-2)}
@media (max-width:820px){.news li{grid-template-columns:4.6em 4.2em minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>大野町 例規検索</h1>
    <p class="asof" id="asof">読み込んでいます</p>
  </header>

  <nav aria-label="編で絞り込む"><ul class="tabs" id="tabs"></ul></nav>

  <main class="main">
    <div class="find">
      <div class="box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="例規名や条文の言葉で検索" autocomplete="off" aria-label="例規名や条文の言葉で検索">
        <button class="clear" id="clear" type="button" aria-label="入力を消す" hidden>×</button>
      </div>
      <div class="opts">
        <div class="seg" id="kind" role="group" aria-label="種別">
          <button type="button" data-v="">すべて</button><button type="button" data-v="条例">条例</button><button type="button" data-v="規則">規則</button><button type="button" data-v="other">その他</button>
        </div>
        <select id="sort" aria-label="並び順">
          <option value="taikei">体系順</option>
          <option value="new">新しい順</option>
          <option value="old">古い順</option>
        </select>
        <label class="ft" for="ft"><input type="checkbox" id="ft"><span>条文も検索</span><small id="ftstate"></small></label>
        <span class="count" id="count" aria-live="polite"></span>
      </div>
    </div>
    <div class="hints" id="hints">よく調べられる語：<button type="button">手数料</button><button type="button">空家</button><button type="button">罰金</button><button type="button">子育て</button><button type="button">個人情報</button><button type="button">消防団</button><button type="button">公園</button></div>
    <div id="news"></div>
    <div id="out"><p class="loading">例規の一覧を読み込んでいます。</p></div>
  </main>

  <footer>
    <p>例規名を押すと、大野町公式サイトの本文が開きます。内容は必ず本文で確かめてください。</p>
    <p>毎週月曜に町の例規集を自動で確認し、追加・改正を反映しています。</p>
    <p>出典：<a href="https://www.town-ono.jp/reiki_int/reiki_taikei/r_taikei_01_01.html" target="_blank" rel="noopener">大野町例規集</a></p>
  </footer>
</div>

<script>
const BASE = "https://www.town-ono.jp/reiki_int/reiki_honbun/";
const ERA = {"明治":1867,"大正":1911,"昭和":1925,"平成":1988,"令和":2018};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseDate(s){
  const m = /(明治|大正|昭和|平成|令和)(元|\d+)年(\d+)月(\d+)日/.exec(s||"");
  if(!m) return {key:0, year:0};
  const y = ERA[m[1]] + (m[2]==="元"?1:+m[2]);
  return {key:y*10000 + (+m[3])*100 + (+m[4]), year:y};
}
const kindOf = no => /^条例/.test(no) ? "条例" : /規則/.test(no) ? "規則" : "other";
const isoJa = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m ? `${+m[1]}年${+m[2]}月${+m[3]}日` : ""; };
const mdJa = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m ? `${+m[2]}月${+m[3]}日` : ""; };

// 検索用の正規化。元の文字列と同じ長さを保つので、ヒット位置をそのまま本文に当てはめられる
function normKeep(s){
  let n = s.normalize("NFKC");
  if(n.length !== s.length){
    let out = "";
    for(const c of s){ const x = c.normalize("NFKC"); out += x.length===c.length ? x : c; }
    n = out;
  }
  const l = n.toLowerCase(); if(l.length===n.length) n = l;
  return n.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
const SYN = [["空き家","空家"],["障がい","障害"],["子ども","子供"]];
function termVariants(q){
  return normKeep(q).split(/[\s　]+/).filter(Boolean).map(t=>{
    const v = new Set([t]);
    SYN.forEach(([a,b])=>{ const na=normKeep(a), nb=normKeep(b); v.add(t.split(na).join(nb)); v.add(t.split(nb).join(na)); });
    return [...v];
  });
}
const hasAll = (s, terms) => terms.every(vs => vs.some(v => s.includes(v)));
function countHits(s, terms){
  let n=0; terms.forEach(vs=>vs.forEach(v=>{ let p=0; while((p=s.indexOf(v,p))>-1){ n++; p+=v.length; } })); return n;
}
function markUp(raw, nrm, terms){
  if(!terms.length) return esc(raw);
  const on = new Uint8Array(raw.length);
  terms.forEach(vs=>vs.forEach(v=>{ let p=0; while((p=nrm.indexOf(v,p))>-1){ on.fill(1,p,p+v.length); p+=v.length; } }));
  let out="", open=false;
  for(let k=0;k<raw.length;k++){
    if(on[k]&&!open){out+="<mark>";open=true}
    if(!on[k]&&open){out+="</mark>";open=false}
    out+=esc(raw[k]);
  }
  return out+(open?"</mark>":"");
}
function snippets(raw, nrm, terms, max=2){
  const found = [];
  terms.forEach(vs=>vs.forEach(v=>{ const p=nrm.indexOf(v); if(p>-1) found.push(p); }));
  found.sort((a,b)=>a-b);
  const spans = [];
  for(const p of found){
    const a = Math.max(0, p-28), b = Math.min(raw.length, p+72);
    if(spans.length && a <= spans[spans.length-1][1]) continue;
    spans.push([a,b]); if(spans.length>=max) break;
  }
  return spans.map(([a,b])=>{
    const r = raw.slice(a,b).replace(/\n/g," "), n = nrm.slice(a,b).replace(/\n/g," ");
    return `<span class="snip">${a>0?"…":""}${markUp(r,n,terms)}${b<raw.length?"…":""}</span>`;
  }).join("");
}

let DATA = [], HENS = [], HUE = {}, META = {}, CHANGES = [], FT = null, ftState = "wait";
const state = {q:"", hen:"", kind:"", sort:"taikei", ft:true, newsAll:false};
try{ const s = JSON.parse(localStorage.getItem("ono-reiki")||"{}"); state.hen=s.hen||""; state.kind=s.kind||""; state.sort=s.sort||"taikei"; state.ft = s.ft!==false; }catch(e){}
const save = () => { try{ localStorage.setItem("ono-reiki", JSON.stringify({hen:state.hen,kind:state.kind,sort:state.sort,ft:state.ft})); }catch(e){} };

function renderTabs(){
  $("tabs").innerHTML =
    `<li><button type="button" class="tab all" data-v="" aria-pressed="${state.hen===""}"><span class="no"></span><span>すべて</span><span class="n">${DATA.length}</span></button></li>` +
    HENS.map(h=>`<li><button type="button" class="tab" style="--h:${h.hue}" data-v="${esc(h.id)}" aria-pressed="${state.hen===h.id}"><span class="no">${esc(h.no)}</span><span>${esc(h.label)}</span><span class="n">${h.n}</span></button></li>`).join("");
}
function renderKind(){ [...$("kind").children].forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.v===state.kind))); }
function renderFt(){
  $("ft").checked = state.ft;
  $("ftstate").textContent = ftState==="wait" ? "（準備中）" : ftState==="none" ? "（データ準備中）" : ftState==="error" ? "（読み込めませんでした）" : "";
  $("ft").disabled = ftState==="none" || ftState==="error";
}
function renderNews(){
  if(state.q){ $("news").innerHTML=""; return; }
  const checked = META.checked ? `最終確認 ${isoJa(META.checked)}` : "";
  let inner;
  if(!CHANGES.length){
    inner = `<p>${META.baseline ? `${isoJa(META.baseline)}から自動確認を始めました。追加や改正が見つかると、ここに表示されます。` : "毎週月曜に町の例規集を確認しています。追加や改正が見つかると、ここに表示されます。"}</p>`;
  }else{
    const list = state.newsAll ? CHANGES : CHANGES.slice(0,5);
    const cls = t => t==="追加"?"add":t==="改正"?"rev":"del";
    inner = `<ul>${list.map(c=>`<li><time datetime="${esc(c.date)}">${mdJa(c.date)}</time><span class="chg ${cls(c.type)}">${esc(c.type)}</span>${c.type.startsWith("廃止")?`<span>${esc(c.name)}</span>`:`<a href="${BASE}${esc(c.id)}.html" target="_blank" rel="noopener">${esc(c.name)}</a>`}</li>`).join("")}</ul>` +
      (CHANGES.length>5 ? `<button type="button" class="more" id="newsMore">${state.newsAll?"5件だけ表示":`すべて表示（${CHANGES.length}件）`}</button>` : "");
  }
  $("news").innerHTML = `<section class="news" aria-label="最近の追加・改正"><h2>最近の追加・改正<small>${checked}</small></h2>${inner}</section>`;
  const m = $("newsMore"); if(m) m.onclick = ()=>{ state.newsAll=!state.newsAll; renderNews(); };
}
function row(d, terms, extra=""){
  const kcls = d.kind==="条例"?"jorei":d.kind==="規則"?"kisoku":"";
  const date = d.date ? `${esc(d.date)}${d.year?`（${d.year}年）`:""}` : "制定日の記載なし";
  return `<li><a href="${BASE}${esc(d.id)}.html" target="_blank" rel="noopener">
    <span class="name">${markUp(d.name, d.nn, terms)}</span>
    <span class="meta"><span class="no2"><span class="k ${kcls}">${esc(d.no||"種別なし")}</span></span><span>${date}</span>${extra}</span>
    ${extra && d.snip ? d.snip : ""}
  </a></li>`;
}
function grouped(rows, terms){
  if(state.sort==="taikei"){
    const groups = [];
    rows.forEach(d=>{ const g=groups[groups.length-1]; if(g && g.cat===d.cat) g.items.push(d); else groups.push({cat:d.cat, hen:d.hen, chap:d.chap, items:[d]}); });
    return groups.map(g=>`<section class="chap" style="--h:${HUE[g.hen]??220}"><h2>${esc(g.hen)}${g.chap?` › ${esc(g.chap)}`:""}</h2><ul>${g.items.map(d=>row(d,terms)).join("")}</ul></section>`).join("");
  }
  rows = rows.slice().sort(state.sort==="new" ? (a,b)=>b.key-a.key : (a,b)=>(a.key||9e9)-(b.key||9e9));
  const groups = [];
  rows.forEach(d=>{ const label = d.year?`${d.year}年`:"制定日の記載なし"; const g=groups[groups.length-1]; if(g && g.label===label) g.items.push(d); else groups.push({label, items:[d]}); });
  return groups.map(g=>`<section class="chap" style="--h:220;--tab-c:0"><h2>${g.label}</h2><ul>${g.items.map(d=>row(d,terms)).join("")}</ul></section>`).join("");
}
function render(){
  const terms = termVariants(state.q);
  const base = DATA.filter(d=>(!state.hen||d.hen===state.hen)&&(!state.kind||d.kind===state.kind));
  const byName = terms.length ? base.filter(d=>hasAll(d.n, terms)) : base;
  let byBody = [];
  const ftReady = state.ft && FT && ftState==="ready";
  if(terms.length && ftReady){
    const nameSet = new Set(byName);
    byBody = base.filter(d=>!nameSet.has(d) && d.bn && hasAll(d.nn+"\n"+d.bn, terms));
    byBody.forEach(d=>{ d.hits = countHits(d.bn, terms); d.snip = snippets(d.body, d.bn, terms); });
    byBody.sort((a,b)=>b.hits-a.hits || a.i-b.i);
  }
  $("clear").hidden = !state.q;
  $("hints").hidden = !!state.q;
  $("count").innerHTML = `<b>${byName.length+byBody.length}</b> 件`;
  renderNews();

  if(!byName.length && !byBody.length){
    const scoped = state.hen || state.kind;
    const ftNote = terms.length && state.ft && !ftReady ? "条文のデータを読み込み中のため、今は例規名だけを検索しています。" : "";
    $("out").innerHTML = `<div class="empty"><p>${state.q?`「${esc(state.q)}」に一致する例規は見つかりませんでした。`:"条件に合う例規はありません。"}${ftNote}語を短くすると見つかることがあります。</p>${scoped?`<button type="button" id="widen">編と種別の絞り込みを外して探す</button>`:""}</div>`;
    const w = $("widen"); if(w) w.onclick = ()=>{ state.hen=""; state.kind=""; save(); renderTabs(); renderKind(); render(); };
    return;
  }
  if(!terms.length){ $("out").innerHTML = grouped(byName, terms); return; }
  let html = "";
  if(byName.length || !ftReady) html += `<section class="sec"><h3>例規名に一致<small>${byName.length}件</small></h3>${byName.length?grouped(byName, terms):`<p>例規名に一致するものはありません。</p>`}</section>`;
  if(ftReady){
    html += `<section class="sec"><h3>条文に一致<small>${byBody.length}件</small></h3>${byBody.length?`<p>該当箇所の多い順に並べています。</p><section class="chap" style="--h:220;--tab-c:0"><ul>${byBody.map(d=>row(d,terms,`<span class="hits">${d.hits}か所</span><span>${esc(d.hen)}${d.chap?` › ${esc(d.chap)}`:""}</span>`)).join("")}</ul></section>`:`<p>条文に一致するものはありません。</p>`}</section>`;
  }else if(state.ft){
    html += `<section class="sec"><h3>条文に一致</h3><p>${ftState==="none"?"条文のデータは、次回の自動確認のあとで使えるようになります。":ftState==="error"?"条文のデータを読み込めませんでした。通信状況を確かめて、ページを開き直してください。":"条文のデータを読み込んでいます。"}</p></section>`;
  }
  $("out").innerHTML = html;
}

function setup(meta){
  META = meta;
  DATA = meta.items.map((r,i)=>{
    const [hen, chap] = (r.cat||"未分類").split("/");
    const d = parseDate(r.date);
    return {...r, i, hen, chap: chap||"", key:d.key, year:d.year, kind:kindOf(r.no||""), nn:normKeep(r.name), n:normKeep(r.name+" "+(r.cat||"")+" "+(r.no||""))};
  });
  HENS = [...new Set(DATA.map(d=>d.hen))].map((h,idx)=>{
    const m = /^(第\d+編)\s*(.*)$/.exec(h) || [h, "", h];
    return {id:h, no:m[1], label:m[2], hue: Math.round(250 + idx*30) % 360, n: DATA.filter(d=>d.hen===h).length};
  });
  HUE = Object.fromEntries(HENS.map(h=>[h.id,h.hue]));
  if(!HENS.some(h=>h.id===state.hen)) state.hen="";
  $("asof").textContent = `${isoJa(meta.checked)}に確認した例規 ${DATA.length}件を収録`;
}
async function getJSON(url){ const r = await fetch(url, {cache:"no-cache"}); if(!r.ok) throw new Error(r.status); return r.json(); }
async function loadFulltext(){
  try{
    const r = await fetch("data/fulltext.json", {cache:"no-cache"});
    if(r.status===404){ ftState="none"; renderFt(); render(); return; }
    if(!r.ok) throw new Error(r.status);
    FT = await r.json();
    const list = DATA.slice();
    // 端末が固まらないよう、少しずつ正規化する
    for(let k=0;k<list.length;k+=25){
      list.slice(k,k+25).forEach(d=>{ const b = FT[d.id]||""; d.body=b; d.bn=normKeep(b); });
      await new Promise(res=>setTimeout(res,0));
    }
    ftState = Object.values(FT).some(Boolean) ? "ready" : "none";
  }catch(e){ ftState="error"; }
  renderFt(); render();
}
async function init(){
  try{ setup(await getJSON("data/reiki.json")); }
  catch(e){ $("out").innerHTML = `<div class="empty"><p>例規の一覧を読み込めませんでした。通信状況を確かめて、ページを開き直してください。</p></div>`; $("asof").textContent=""; return; }
  $("sort").value = state.sort;
  renderTabs(); renderKind(); renderFt(); render();
  getJSON("data/changes.json").then(c=>{ CHANGES = Array.isArray(c)?c:[]; renderNews(); }).catch(()=>{});
  loadFulltext();
}

$("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
$("q").addEventListener("keydown", e=>{ if(e.key==="Escape"){ state.q=""; e.target.value=""; render(); } });
$("clear").addEventListener("click", ()=>{ state.q=""; $("q").value=""; $("q").focus(); render(); });
$("tabs").addEventListener("click", e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  state.hen = b.dataset.v; save(); renderTabs(); render();
  const nb = $("tabs").querySelector(`[aria-pressed="true"]`); if(nb) nb.scrollIntoView({block:"nearest",inline:"nearest"});
});
$("kind").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; state.kind=b.dataset.v; save(); renderKind(); render(); });
$("sort").addEventListener("change", e=>{ state.sort=e.target.value; save(); render(); });
$("ft").addEventListener("change", e=>{ state.ft=e.target.checked; save(); render(); });
$("hints").addEventListener("click", e=>{ if(e.target.tagName!=="BUTTON") return; state.q=e.target.textContent; $("q").value=state.q; render(); });
init();

if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
